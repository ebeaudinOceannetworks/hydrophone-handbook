name: Quarto Publish

on:
  push:
    branches: [ main, master ]
  schedule:
    - cron: "0 16 * * *" #16 UTC, 8 PST
  workflow_dispatch:

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6    # Updated from v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Set up Python
        uses: actions/setup-python@v6 # Updated from v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Re-execute instead of using frozen results
        run: rm -rf _freeze

      - name: Render and Publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ONC_API_TOKEN: ${{ secrets.ONC_API_TOKEN }}
