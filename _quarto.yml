project:
  type: book
  output-dir: _book
  resources:
    - images/
    - audio/
    - sounds/
    - banner.html
    - scripts/
    - fonts/

# --- to publish the website on github ---

execute:
  freeze: auto # only re-renders .qmd files when they have been modified
  echo: true
  warning: false

jupyter: python3

lightbox: true

# ----------------------------------------

book:
  title: "Hydrophone Handbook"
  date: today
  date-format: "MMMM D, YYYY"

  
  chapters:
    - index.qmd
    - sections/2-whats-new.qmd
    - sections/3-hydrophone-map.qmd
    - sections/4-hydrophone-models.qmd
    - sections/5-array-engineering.qmd
    - sections/6-hydrophone-life-cycle.qmd
    - sections/7-calibration-hydrocal.qmd
    - sections/8-data-products.qmd
    - sections/9-data-access.qmd
    - sections/10-data-diversion.qmd
    - sections/11-sound-gallery.qmd
    - sections/12-soundscape-taxonomy.qmd
    - sections/13-science-and-publications.qmd
    - sections/14-community-observatories.qmd

  sidebar:
    style: "docked"
    background: "#003366"
    foreground: "#ffffff"
    collapse-level: 2


format:
  html:
    theme: quartz
    smooth-scroll: true
    include-in-header: banner.html
    css: styles.css
    lightbox:
      match: auto
    grid:
      sidebar-width: 320px
      gutter-width: 2em
    navigation:
      full-logo: true
      inter-item-area: true
    toc: true
    number-sections: false
    sidebar-toc: true
    toc-depth: 2
    sticky-sidebar: true
    page-layout: article
    self-contained: false
    link-external-newwindow: true